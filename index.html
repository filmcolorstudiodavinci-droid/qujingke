  <style>
    :root{color-scheme:dark;--bg:#101411;--panel:#191f1a;--muted:#a1aaa1;--lime:#c6f36a;--line:#ffffffa6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5ef;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}

    .motion-demo{position:absolute;inset:0;z-index:1;overflow:hidden;background:#183239;color:#f4f7f0}
    .motion-demo{isolation:isolate}

<body>
  <main class="app">
    <header><div class="brand-lockup" role="img" aria-label="取景课 · 短视频拍摄学习助手"></div></header>
    <h1>看懂画面，拍好每一镜。</h1>
    <p class="sub">选练习、看示范，再用自己的镜头试一遍。</p>

    <div class="section-head"><strong>选择练习</strong><span>先选类别，再选项目</span></div>
    <div class="tabs" role="tablist" aria-label="练习类别">
      <button class="tab" role="tab" aria-selected="true" data-kind="shot">景别</button>
      <button class="tab" role="tab" aria-selected="false" data-kind="composition">构图</button>
      <button class="tab" role="tab" aria-selected="false" data-kind="movement">镜头运动</button>
    </div>
    <div class="drill-heading"><span id="drillHeading">景别练习</span><span>左右滑动选择</span></div>
    <div class="drill-list" id="drillList" role="group" aria-label="具体练习项目"></div>

    <section class="viewfinder" aria-label="手机取景预览">
      <video id="camera" autoplay muted playsinline></video>
      <div class="scene" id="placeholder" aria-hidden="true"><div class="comp-scene hidden" id="compScene"></div><img class="scene-image" src="./shots/actor.webp" alt="取景示范人物"></div>
      <div class="motion-demo hidden" id="motionDemo" aria-live="polite">
        <canvas class="mg-canvas" id="mgCanvas" role="img" aria-label="镜头运动实时演示"></canvas>
      </div>
      <div class="grid" id="grid" aria-hidden="true"><svg class="guide-svg" id="guideSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
        <div class="countdown hidden" id="countdown" aria-hidden="true">3</div>
      <div class="frame-label" id="frameLabel">三分法 · 交点构图</div>
      <div class="guide-legend hidden" id="guideLegend">箭头表示镜头运动方向</div>
    </section>

    <div class="motion-plan hidden" id="motionPlan" aria-hidden="true">
      <canvas id="mgPlan"></canvas>
      <div class="mp-info"><b id="mpTitle">俯视机位图</b><span id="mpNote">机位沿轴线前推，主体由小变大</span></div>
    </div>
    <div class="aspect-row" role="group" aria-label="拍摄画幅">
      <span class="aspect-label">画幅</span>
      <button class="aspect-option" type="button" data-ratio="16/9" data-value="1.777778" aria-pressed="false">16:9</button>
      <button class="aspect-option" type="button" data-ratio="9/16" data-value="0.5625" aria-pressed="true">9:16</button>
      <button class="toggle" id="gridToggle" role="switch" aria-checked="true" aria-label="辅助参考线">
        <span class="switch" aria-hidden="true"></span><span class="control-label">辅助参考线</span>
      </button>
    </div>
    <div class="enhance-row" role="group" aria-label="取景器增强">
      <span class="aspect-label">参考线</span>
      <button class="guide-chip" type="button" data-guide="lesson" aria-pressed="true">课程</button>
      <button class="guide-chip" type="button" data-guide="thirds" aria-pressed="false">三分</button>
      <button class="guide-chip" type="button" data-guide="center" aria-pressed="false">中心</button>
      <button class="guide-chip" type="button" data-guide="diagonal" aria-pressed="false">对角</button>
      <button class="guide-chip" type="button" data-guide="golden" aria-pressed="false">黄金</button>
      <button class="guide-chip" type="button" data-guide="off" aria-pressed="false">关</button>
    </div>

      aspectOptions.forEach(option=>option.disabled=false);
      if(!recordedBlob||recordedBlob.size<2048){
        const messages=['本次录制没有生成视频，已切换为备用模式：请再点一次「开始录制」重试。','备用模式仍然失败，已切换为原画直录：请再点一次「开始录制」重试。','直录仍失败，已切换为无音轨直录：请再点一次「开始录制」重试。'];
        if(recMode==='wc'){wcFailCount++;recLadder=0;recordStatus.textContent='本次录制没有生成视频，已切换为备用录制模式：请再点一次「开始录制」重试。'}
        else if(recLadder<3){recordStatus.textContent=messages[recLadder];recLadder++}
        else{
          emptyRecordCount++;
          const fallback=useNativeCapture&&emptyRecordCount>=2;
          recordStatus.textContent=fallback?'网页录制连续失败，已切换为系统原相机模式：请再点一次「开始录制」。':'本次录制没有生成视频，请再点一次「开始录制」重试。';
          if(fallback)nativeVideoNext=true;
        }
        recState='idle';recordedBlob=null;cameraButton.disabled=false;cameraButton.textContent='开启相机';restartRecordingUI();return;
      }
      emptyRecordCount=0;
      document.querySelector('#placeholder').classList.remove('hidden');
      recordStatus.textContent='录制完成，正在打开系统保存面板…';
      void saveRecording();
    }
    async function saveRecording(){
      if(!recordedBlob||recordedBlob.size<2048)return;
      const type=recordedBlob.type||'video/mp4';
      const extension=type.includes('mp4')?'mp4':'webm';
      const name=`qujingke-${new Date().toISOString().replace(/[:.]/g,'-')}.${extension}`;
      const file=new File([recordedBlob],name,{type});
      const saved=await saveToPhotos(file,'已保存到照片。');
      if(saved===false){
        recState='idle';
        recordButton.setAttribute('aria-pressed','false');
        recordButton.textContent='重新保存到照片';recordButton.disabled=false;
        recordStatus.textContent='保存已取消，视频还在：点「重新保存到照片」可再存一次，或点「关闭相机」放弃本次视频。';
        return;
      }
      clearRecordingPreview();
      showLesson(selectedLesson);
      setTimeout(restartPreview,2500);
    }
    function clearRecordingPreview(){
      recCleanup();
      recordedBlob=null;recState='idle';
      recordButton.setAttribute('aria-pressed','false');
      try{video.pause();video.srcObject=null;video.removeAttribute('src');video.controls=false;video.muted=true;video.load()}catch(error){}
      restartRecordingUI();
    }
    cameraButton.addEventListener('click',async()=>{
      const message=document.querySelector('#cameraMessage');
      if(!stream&&recordedBlob&&recState==='idle'){
        clearRecordingPreview();
        document.querySelector('#placeholder').classList.remove('hidden');
        message.classList.remove('hidden');
        cameraButton.textContent='开启相机';
        recordStatus.textContent='已放弃本次未保存的视频。';
        return;
      }
      if(stream){
        try{stream.getTracks().forEach(track=>track.stop())}catch(error){}
        stream=null;video.srcObject=null;video.style.display='none';
        if(activeKind==='movement'){document.querySelector('#motionDemo').classList.remove('hidden','compact');message.classList.add('hidden')}
        else{document.querySelector('#placeholder').classList.remove('hidden');message.classList.remove('hidden')}
        cameraButton.textContent='开启相机';
        viewfinder.classList.toggle('on-light',activeKind==='shot');
        document.querySelector('#placeholder').classList.remove('ghost');
        if(countdownTimer){clearInterval(countdownTimer);countdownTimer=0;document.querySelector('#countdown').classList.add('hidden')}
        recordStatus.textContent='相机已关闭。视频只在本机处理，保存时不会上传。';
        return;
      }
      if(!navigator.mediaDevices?.getUserMedia){message.textContent='当前环境无法访问相机，请用 HTTPS 地址在手机浏览器中打开';message.classList.remove('hidden');return}
      cameraButton.disabled=true;
      let micDenied=false;
      try{
        const videoConstraints={facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};
        let nextStream=null;
        try{nextStream=await navigator.mediaDevices.getUserMedia({video:videoConstraints,audio:true})}
        catch(error){
          const denied=error&&(error.name==='NotAllowedError'||error.name==='NotReadableError'||error.name==='NotFoundError'||error.name==='OverconstrainedError');
          if(!denied)throw error;
          nextStream=await navigator.mediaDevices.getUserMedia({video:videoConstraints,audio:false});
          micDenied=true;
        }
        clearRecordingPreview();
        stream=nextStream;video.srcObject=stream;video.controls=false;video.style.display='block';
        document.querySelector('#placeholder').classList.add('hidden');
        if(activeKind==='movement'){document.querySelector('#motionDemo').classList.remove('hidden');document.querySelector('#motionDemo').classList.add('compact')}else document.querySelector('#motionDemo').classList.add('hidden');
        viewfinder.classList.remove('on-light');message.classList.add('hidden');
        cameraButton.textContent='关闭相机';recordButton.disabled=false;
        recordStatus.textContent=micDenied?'相机已开启（麦克风未授权，录制不带声音）。点击“开始录制”开始拍摄。':'相机和麦克风已准备好，点击“开始录制”开始拍摄。';
      }catch(error){
        message.textContent=error.name==='NotAllowedError'?'相机权限未开启，请在浏览器的网站设置中允许访问后重试':'暂时无法开启相机，请检查设备相机是否可用';
        message.classList.remove('hidden');
      }finally{cameraButton.disabled=false}
    });
    function waitCameraReady(timeout){return new Promise(resolve=>{const start=Date.now();(function poll(){if(stream&&video.videoWidth>0)return resolve(true);if(Date.now()-start>timeout)return resolve(false);setTimeout(poll,150)})()})}
    recordButton.addEventListener('click',async()=>{
      if(recState==='recording'){stopRecording();return}
      if(recState!=='idle')return;
      if(recordedBlob&&recordedBlob.size){await saveRecording();return}
      if(nativeVideoNext){nativeVideoNext=false;useNativeCamera('video');return}
      await startRecording();
    });
    window.addEventListener('pagehide',()=>{
      clearInterval(poseTimer);clearInterval(recTick);recTick=0;
      try{if(wcEncoder&&wcEncoder.state!=='closed')wcEncoder.close()}catch(error){}
      try{if(mr){mr.onstop=null;if(mr.state==='recording')mr.stop()}}catch(error){}
      try{stream&&stream.getTracks().forEach(track=>track.stop())}catch(error){}
      try{mrStream&&mrStream.getTracks().forEach(track=>track.stop())}catch(error){}
    });
(function(){
      const hint=document.querySelector('#installHint'),text=document.querySelector('#installHintText'),btn=document.querySelector('#installBtn'),close=document.querySelector('#installClose');
      let deferredPrompt=null;
      const dismissed=(()=>{try{return localStorage.getItem('qujingke-install-dismissed')==='1'}catch(error){return false}})();
      const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
      const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.userAgent));
      function show(){hint.classList.remove('hidden')}
      function dismiss(){hint.classList.add('hidden');try{localStorage.setItem('qujingke-install-dismissed','1')}catch(error){}}
      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;if(!dismissed){text.textContent='安装取景课到手机：全屏打开、离线可用、不占桌面浏览器标签。';btn.classList.remove('hidden');show()}});
      btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(error){}deferredPrompt=null;dismiss()});
      window.addEventListener('appinstalled',dismiss);
      close.addEventListener('click',dismiss);
      if(!dismissed&&!standalone&&isIOS&&!deferredPrompt)show();
    })();
    /* ================= 取景器增强：参考线样式 ================= */
    function currentRatio(){return Number(document.querySelector('.aspect-option[aria-pressed="true"]').dataset.value)}
    const guideSvgEl=document.querySelector('#guideSvg');
    let guideOverride='lesson';
    function guideThirds(){return '<path class="guide-line" d="M33.3 0v100M66.7 0v100M0 33.3h100M0 66.7h100"/>'}
    function guideCenter(){return '<path class="guide-line" d="M50 0v100M0 50h100"/><circle class="guide-dot" cx="50" cy="50" r="2.4"/>'}
    function guideDiagonal(){return '<path class="guide-line" d="M0 0L100 100M0 100L100 0"/><circle class="guide-dot" cx="50" cy="50" r="1.8"/>'}
    function guideGolden(){
      const x1=38.2,x2=61.8;
      let out='<path class="guide-line" d="M'+x1+' 0v100M'+x2+' 0v100M0 38.2h100M0 61.8h100"/>';
      [[x1,38.2],[x2,38.2],[x1,61.8],[x2,61.8]].forEach(p=>{
        out+='<circle class="guide-dot" cx="'+p[0]+'" cy="'+p[1]+'" r="1.7"/>';
      });
      return out;
    }
    function applyGuideOverride(){
      if(guideOverride==='lesson')return;
      if(guideOverride==='off'){guideSvgEl.innerHTML='';return}
      guideSvgEl.innerHTML=guideOverride==='thirds'?guideThirds():guideOverride==='center'?guideCenter():guideOverride==='diagonal'?guideDiagonal():guideGolden();
    }
    const guideChips=[...document.querySelectorAll('.guide-chip[data-guide]')];
    guideChips.forEach(chip=>chip.addEventListener('click',()=>{guideOverride=chip.dataset.guide;guideChips.forEach(c=>c.setAttribute('aria-pressed',String(c===chip)));applyGuideOverride()}));

    /* ================= 统一保存出口 + 系统原相机兜底 ================= */
    function restartRecordingUI(){recordButton.textContent='开始录制';recordButton.disabled=false;recordButton.setAttribute('aria-pressed','false');aspectOptions.forEach(option=>option.disabled=false)}
    function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
    const useNativeCapture=/iphone|ipad|ipod|android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.userAgent));
    const isIOSDevice=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.userAgent));
    const isAppleDevice=/iphone|ipad|ipod|macintosh/i.test(navigator.userAgent);
    const PHOTO_HINT=isIOSDevice?'正在打开系统面板：请点【存储图像 / 存储视频】保存到照片':'正在打开系统面板：请选【保存到相册 / 添加到图库】';
    function downloadHint(){return isIOSDevice?'iPhone 网页无法直接写入照片：文件已保存到「文件」App，可打开文件→分享→存储图像存入相册。':'已下载保存：多数安卓手机相册会自动显示该文件（在 Download 文件夹）。'}
    async function saveToPhotos(file,okMsg){try{if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){recordStatus.textContent=PHOTO_HINT;await navigator.share({files:[file],title:'取景课拍摄练习'});recordStatus.textContent=okMsg;return true}}catch(error){if(error&&error.name==='AbortError'){recordStatus.textContent='已取消保存，视频仍保留在本机内存中。';return false}}downloadBlob(file,file.name);recordStatus.textContent=downloadHint();return true}
    const nativeVideoInput=document.querySelector('#videoCapture');
    function useNativeCamera(kind){nativeVideoInput.value='';nativeVideoInput.click();recordStatus.textContent='已调起系统原相机：拍摄完成点“使用视频/照片”，即自动保存到手机。'}
    nativeVideoInput.addEventListener('change',()=>{const f=nativeVideoInput.files&&nativeVideoInput.files[0];nativeVideoInput.value='';if(!f)return;recordStatus.textContent='拍摄完成，正在保存…';saveToPhotos(f,'已保存到照片。')});
        if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
